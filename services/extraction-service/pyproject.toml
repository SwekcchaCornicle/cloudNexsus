[build-system]
requires = ["setuptools>=68","wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cloudnexus-extraction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0","uvicorn[standard]>=0.30,<1.0","pydantic>=2.8,<3.0","boto3>=1.35,<2.0","python-dotenv>=1.0,<2.0", "google-genai>=1.0"]
[project.optional-dependencies]
dev = ["pytest>=8.0","httpx>=0.27","ruff>=0.6"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
